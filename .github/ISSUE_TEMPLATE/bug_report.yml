name: Bug Report
description: Report a bug with yt-transcript-yoinker
title: "[BUG] "
labels: bug

body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to fill this out! If the button doesn't appear, please check if the video actually has a transcript first (YouTube > ... > Show transcript).

- type: input
  id: extension_version
  attributes:
    label: Extension Version
    description: Find it at about:addons
    placeholder: v2.2.5
  validations:
    required: true

- type: input
  id: firefox_version
  attributes:
    label: Firefox Version
    placeholder: "135.0"
  validations:
    required: true

- type: dropdown
  id: os
  attributes:
    label: Operating System
    options:
      - Windows
      - macOS
      - Linux
      - Other
  validations:
    required: true

- type: textarea
  id: description
  attributes:
    label: Bug Description
  validations:
    required: true

- type: textarea
  id: repro_steps
  attributes:
    label: Steps to Reproduce
    value: |
      1. Go to '...'
      2. Click on '...'
      3. See error
  validations:
    required: true

- type: textarea
  id: expected
  attributes:
    label: Expected Behavior
  validations:
    required: true


