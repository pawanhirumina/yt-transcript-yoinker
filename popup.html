<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 260px; padding: 18px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: #111; }
body.dark { background: #121212; color: #eee; }
h3 { font-size: 18px; margin-bottom: 16px; }
.input-field { display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #d8d9d74d; }
.input-field label { font-size: 13px; font-weight: 500; }
.switch { position: relative; width: 42px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e5e5e5; transition:.3s; border-radius: 26px; }
.slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 2px; bottom: 2px; background-color: white; transition:.3s; border-radius: 50%; }
input:checked +.slider { background-color: #ff0000; }
input:checked +.slider:before { transform: translateX(16px); }
select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ddd; margin-top: 8px; font-size: 13px; }
body.dark select { background: #222; color: #eee; border-color: #333; }
button#yoink { background: #ff0000; color: white; border: 0; padding: 12px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: 600; margin-top: 16px; font-size: 14px; }
button#yoink:hover { background: #d90000; }
body.dark button#yoink { background: #fff; color: #000; }
#status{text-align:center;font-size:11px;margin-top:10px;min-height:14px;color:#666;}
code { display: block; text-align: center; margin-top: 12px; font-size: 10px; color: #999; }
</style>
</head>
<body>
  <h3>YT Yoinker</h3>
  
  <div class="input-field">
    <label for="darkMode">Enable Darkmode</label>
    <label class="switch"><input type="checkbox" id="darkMode"><span class="slider"></span></label>
  </div>

  <div class="input-field">
    <label for="timestamps">Include Time Stamps</label>
    <label class="switch"><input type="checkbox" id="timestamps"><span class="slider"></span></label>
  </div>
  <div class="input-field">
    <label for="hideButton">Hide button</label>
    <label class="switch"><input type="checkbox" id="hideButton"><span class="slider"></span></label>
  </div>

  <div style="margin-top:14px">
    <label style="font-size:13px;font-weight:500">Export as</label>
    <select id="format">
      <option value="txt">Copy as Text</option>
      <option value="srt-copy">Copy as SRT</option>
      <option value="srt-download">Download SRT file</option>
    </select>
  </div>

  <button id="yoink">Yoink</button>
  <div id="status"></div>
  <code>v2.3.5</code>
  <script src="popup.js"></script>
</body>
</html>
